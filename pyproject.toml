[project]
name = "rv-dimred"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.0",
    "numpy>=2.4.6",
    "polars>=1.41.2",
    "scanpy>=1.12.1",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ipython>=9.14.1",
    "mypy>=2.1.0",
    "ruff>=0.15.17",
]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
disallow_untyped_defs = true
ignore_missing_imports = true 
